name: release-tag-main

on:
  push:
    branches:
      - main
    paths-ignore:
      - .kit.yaml

permissions:
  contents: write

concurrency:
  group: release-tag-main
  queue: max

jobs:
  prepare-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      next_tag: ${{ steps.select_tag.outputs.next_tag }}
      mode: ${{ steps.select_tag.outputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run release quality gates
        run: |
          make vet
          make test

      - name: Select v3 release tag
        id: select_tag
        shell: bash
        run: .github/scripts/release-next-tag.sh HEAD >> "${GITHUB_OUTPUT}"

      - name: Create and push release tag
        shell: bash
        env:
          HEAD_SHA: ${{ steps.select_tag.outputs.head_sha }}
          MODE: ${{ steps.select_tag.outputs.mode }}
          NEXT_TAG: ${{ steps.select_tag.outputs.next_tag }}
        run: |
          set -euo pipefail

          if [[ "${MODE}" == "reuse" ]]; then
            echo "Reusing ${NEXT_TAG} on ${HEAD_SHA} for publication recovery."
            exit 0
          fi

          if git rev-parse --verify --quiet "refs/tags/${NEXT_TAG}" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "refs/tags/${NEXT_TAG}")"
            if [[ "${tag_sha}" != "${HEAD_SHA}" ]]; then
              echo "Tag ${NEXT_TAG} points to ${tag_sha}; refusing to move it." >&2
              exit 1
            fi
            exit 0
          fi

          git config user.name "jamesonstone"
          git config user.email "4779701+jamesonstone@users.noreply.github.com"

          git tag -a "${NEXT_TAG}" -m "Release ${NEXT_TAG}"
          git push origin "${NEXT_TAG}"

  publish-release:
    needs: prepare-release
    # Tags pushed with this workflow's GITHUB_TOKEN do not trigger a second
    # workflow run, so this job publishes both newly created and reused tags.
    if: needs.prepare-release.outputs.next_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout release tag
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.next_tag }}
        run: |
          set -euo pipefail
          git fetch --tags
          git checkout "tags/${TAG}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Build artifacts with GoReleaser
        # publish is intentionally skipped so gh can create release with --generate-notes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --skip=publish --skip=announce

      - name: Publish GitHub release with generated notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.next_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(dist/*.tar.gz dist/*.zip dist/checksums.txt)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts found in dist/." >&2
            exit 1
          fi

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${files[@]}" --clobber
          else
            gh release create "${TAG}" "${files[@]}" --generate-notes --title "${TAG}"
          fi
