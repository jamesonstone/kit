name: release-tag-main

on:
  push:
    branches:
      - main
    paths-ignore:
      - .kit.yaml

permissions:
  contents: write

concurrency:
  group: release-tag-main
  queue: max

jobs:
  prepare-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      next_tag: ${{ steps.select_tag.outputs.next_tag }}
      mode: ${{ steps.select_tag.outputs.mode }}
      head_sha: ${{ steps.select_tag.outputs.head_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run release quality gates
        run: |
          make vet
          make test

      - name: Select v3 release tag
        id: select_tag
        shell: bash
        run: .github/scripts/release-next-tag.sh HEAD >> "${GITHUB_OUTPUT}"

      - name: Write release notes
        id: release_notes
        shell: bash
        env:
          TAG: ${{ steps.select_tag.outputs.next_tag }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/kit-release-notes.md"
          printf '# %s\n\nKit %s release.\n' "${TAG}" "${TAG}" > "${notes_file}"
          echo "path=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Create or reuse immutable release tag with Mint
        id: mint_tag
        uses: jamesonstone/mint@v0.2.1
        with:
          command: release-tag
          release-tag: ${{ steps.select_tag.outputs.next_tag }}
          target-sha: ${{ steps.select_tag.outputs.head_sha }}
          release-notes-file: ${{ steps.release_notes.outputs.path }}
          release-remote: origin
          release-push: "true"

  publish-release:
    needs: prepare-release
    # Tags pushed with this workflow's GITHUB_TOKEN do not trigger a second
    # workflow run, so this job publishes both newly created and reused tags.
    if: needs.prepare-release.outputs.next_tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout release tag
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.next_tag }}
        run: |
          set -euo pipefail
          git fetch --tags
          git checkout "tags/${TAG}"

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: Build artifacts with GoReleaser
        # Mint owns GitHub Release state; GoReleaser owns artifact production.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: goreleaser release --clean --skip=publish --skip=announce

      - name: Validate GoReleaser artifacts
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip dist/checksums.txt)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts found in dist/." >&2
            exit 1
          fi

      - name: Write GitHub Release notes
        id: publish_notes
        shell: bash
        env:
          TAG: ${{ needs.prepare-release.outputs.next_tag }}
        run: |
          set -euo pipefail
          notes_file="${RUNNER_TEMP}/kit-release-notes.md"
          printf '# %s\n\nKit %s release.\n' "${TAG}" "${TAG}" > "${notes_file}"
          echo "path=${notes_file}" >> "${GITHUB_OUTPUT}"

      - name: Create or reuse GitHub Release with Mint
        id: mint_release
        uses: jamesonstone/mint@v0.2.1
        with:
          command: github-release
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          release-tag: ${{ needs.prepare-release.outputs.next_tag }}
          target-sha: ${{ needs.prepare-release.outputs.head_sha }}
          release-title: ${{ needs.prepare-release.outputs.next_tag }}
          release-notes-file: ${{ steps.publish_notes.outputs.path }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare-release.outputs.next_tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(dist/*.tar.gz dist/*.zip dist/checksums.txt)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release artifacts found in dist/." >&2
            exit 1
          fi

          gh release upload "${TAG}" "${files[@]}" --clobber
