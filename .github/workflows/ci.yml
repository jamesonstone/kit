name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet
        run: make vet

      - name: Test
        run: make test

      - name: Build
        run: make build

      - name: Kit project check
        env:
          KIT_USAGE_DISABLED: "1"
        run: ./bin/kit check --project

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11
