schema_version: 1
id: readme-rules-private-repo
title: Init keeps managed README behavior discoverable
category: readme
fixture: docs/evals/kit-improve/fixtures/repos/minimal-kit-project
persona: coding-agent
timeout_seconds: 30
input_prompt: Verify README scaffolding remains owned by the protected init interface.
expected_behavior: Kit exposes init as a bounded managed-file operation with a read-only preview.
oracle: deterministic-cli
mutation_policy: fixture-only
allowed_surfaces:
  - README.md
commands:
  - "{{kit}} capabilities init --json"
assertions:
  - type: stdout_contains
    command_index: 0
    value: '"command": "init"'
  - type: stdout_contains
    command_index: 0
    value: --dry-run
  - type: git_diff_empty
regression_tags:
  - readme
held_out_eligible: true
known_failure_modes:
  - readme:init-contract-missing
