schema_version: 1
id: context-feature-evidence
title: Feature resolution includes living specification evidence
category: context
fixture: docs/evals/kit-improve/fixtures/repos/prompt-system-project
persona: coding-agent
timeout_seconds: 30
input_prompt: Resolve the implementation workflow for a named feature.
expected_behavior: The contract includes the repository-local feature specification and its referenced Constitution.
oracle: deterministic-cli
mutation_policy: read-only
allowed_surfaces: []
commands:
  - "{{kit}} context resolve --workflow implementation-delivery --feature prompt-benchmark --json"
assertions:
  - type: command_succeeds
    command_index: 0
  - type: stdout_contains
    command_index: 0
    value: docs/specs/0001-prompt-benchmark/SPEC.md
  - type: stdout_contains
    command_index: 0
    value: docs/CONSTITUTION.md
  - type: git_diff_empty
regression_tags:
  - agent-contract
held_out_eligible: false
known_failure_modes:
  - context:feature-spec-missing
